<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": {{ page.title | jsonify }},
    "description": {{ page.description | jsonify }},
    "author": { "@type": "Person", "name": {{ page.author | jsonify }} },
    "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
    "mainEntityOfPage": {{ page.url | absolute_url | jsonify }}
  }
  </script>
  <style>
    body { max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem; color: #1f2328;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
           line-height: 1.65; }
    h1 { font-size: 1.6em; line-height: 1.3; }
    h2 { margin-top: 2em; border-bottom: 1px solid #d8dee4; padding-bottom: .3em; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: .93em; display: block; overflow-x: auto; }
    th, td { border: 1px solid #d0d7de; padding: 6px 12px; text-align: left; white-space: nowrap; }
    th { background: #f6f8fa; }
    code { background: #eff1f3; padding: .2em .4em; border-radius: 4px; font-size: .88em; }
    pre { background: #f6f8fa; padding: 1rem; border-radius: 6px; overflow-x: auto; }
    pre code { background: none; padding: 0; }
    a { color: #0969da; }
    main img { max-width: 100%; height: auto; border: 1px solid #d8dee4; border-radius: 6px; margin: 1rem 0; }
    blockquote { margin: 0; padding: 0 1em; color: #59636e; border-left: .25em solid #d0d7de; }
    .related { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #d8dee4; font-size: .92em; }
    .related h2 { font-size: 1.05em; border-bottom: none; margin-top: 0; }
  </style>
</head>
<body>
  <main>
    {{ content }}
    {% if page.related %}
    <section class="related">
      {% if page.lang == 'zh-CN' %}<h2>相关指南</h2>{% else %}<h2>Related guides</h2>{% endif %}
      <ul>
        {% for link in page.related %}
        <li><a href="{{ link.url }}">{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </section>
    {% endif %}
  </main>
</body>
</html>
